name: Production Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  statuses: read

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag and commit
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: $RELEASE_TAG"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          git fetch origin main --tags

          if ! git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag does not exist: $RELEASE_TAG"
            exit 1
          fi

          RELEASE_SHA="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          SHORT_SHA="${RELEASE_SHA::7}"

          echo "Release tag:     $RELEASE_TAG"
          echo "Release version: $RELEASE_VERSION"
          echo "Release commit:  $RELEASE_SHA"
          echo "Short SHA:       $SHORT_SHA"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify commit is on main
        run: |
          RELEASE_SHA="${{ steps.release.outputs.release_sha }}"

          git fetch origin main

          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release commit is not on main"
            exit 1
          fi

          echo "Release commit is on main"

      - name: Verify VERSION matches tag
        run: |
          RELEASE_SHA="${{ steps.release.outputs.release_sha }}"
          RELEASE_VERSION="${{ steps.release.outputs.release_version }}"

          FILE_VERSION="$(git show "$RELEASE_SHA:VERSION")"

          if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag version:   $RELEASE_VERSION"
            echo "VERSION file:  $FILE_VERSION"
            echo "VERSION mismatch"
            exit 1
          fi

          echo "VERSION matches release tag"

      - name: Verify staging passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA="${{ steps.release.outputs.release_sha }}"
          SHORT_SHA="${{ steps.release.outputs.short_sha }}"

          echo "Checking staging status for commit: $SHORT_SHA"

          STATUS="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/status" \
              --jq '
                .statuses
                | sort_by(.created_at)
                | reverse
                | .[]
                | select(.context == "staging/smoke-test")
                | .state
              ' \
              | head -n 1
          )"

          if [ "$STATUS" != "success" ]; then
            echo "Staging did not pass for commit $SHORT_SHA"
            echo "Status: ${STATUS:-missing}"
            exit 1
          fi

          echo "Staging passed for $SHORT_SHA"

  promote:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote existing image
        run: |
          SHORT_SHA="${{ needs.validate.outputs.short_sha }}"
          VERSION="${{ needs.validate.outputs.release_version }}"

          SOURCE="ghcr.io/mubashirqamar015-bit/mlops-cd-demo:sha-$SHORT_SHA"
          RELEASE="ghcr.io/mubashirqamar015-bit/mlops-cd-demo:$VERSION"
          LATEST="ghcr.io/mubashirqamar015-bit/mlops-cd-demo:latest"

          echo "Source image:  $SOURCE"
          echo "Release tag:   $RELEASE"
          echo "Latest tag:    $LATEST"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$RELEASE" \
            "$SOURCE"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$LATEST" \
            "$SOURCE"

      - name: Verify image digests
        run: |
          SHORT_SHA="${{ needs.validate.outputs.short_sha }}"
          VERSION="${{ needs.validate.outputs.release_version }}"

          SOURCE_DIGEST="$(
            docker buildx imagetools inspect \
              "ghcr.io/mubashirqamar015-bit/mlops-cd-demo:sha-$SHORT_SHA" \
              --format '{{json .Manifest.Digest}}'
          )"

          RELEASE_DIGEST="$(
            docker buildx imagetools inspect \
              "ghcr.io/mubashirqamar015-bit/mlops-cd-demo:$VERSION" \
              --format '{{json .Manifest.Digest}}'
          )"

          echo "SHA digest:     $SOURCE_DIGEST"
          echo "Release digest: $RELEASE_DIGEST"

          if [ "$SOURCE_DIGEST" != "$RELEASE_DIGEST" ]; then
            echo "Digest mismatch"
            exit 1
          fi

          echo "Same image digest confirmed"

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy release to production
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.release_version }}"
          IMAGE="ghcr.io/mubashirqamar015-bit/mlops-cd-demo:$VERSION"

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" \
            > ~/.ssh/production_key

          chmod 600 ~/.ssh/production_key

          printf '%s' "$GHCR_TOKEN" |
            ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/production_key \
              "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" \
              "docker login ghcr.io \
                -u '${{ github.actor }}' \
                --password-stdin &&
               docker pull $IMAGE &&
               docker rm -f mlops-api 2>/dev/null || true &&
               docker run -d \
                 --restart unless-stopped \
                 --name mlops-api \
                 -p 5000:5000 \
                 $IMAGE"

      - name: Verify production health
        run: |
          VERSION="${{ needs.validate.outputs.release_version }}"

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" \
            > ~/.ssh/production_key

          chmod 600 ~/.ssh/production_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/production_key \
            "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" \
            "for i in {1..10}; do
               RESPONSE=\$(curl -fsS http://localhost:5000/health) && {
                 echo \"\$RESPONSE\"

                 echo \"\$RESPONSE\" |
                   grep -q '\"application_version\":\"$VERSION\"' &&
                 echo \"\$RESPONSE\" |
                   grep -q '\"status\":\"healthy\"' &&
                 exit 0
               }

               echo 'Health check failed, retrying...'
               sleep 3
             done

             echo 'Production health check failed'
             exit 1"