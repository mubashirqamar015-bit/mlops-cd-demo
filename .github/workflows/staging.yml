name: Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  status-pending:
    runs-on: ubuntu-latest

    steps:
      - name: Set staging status to pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "staging/smoke-test",
              description: "Staging deployment in progress"
            });

  tests:
    needs: status-pending
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="$(cat VERSION)"

          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg APPLICATION_VERSION="$VERSION" \
            --build-arg GIT_COMMIT="$SHORT_SHA" \
            -t ghcr.io/mubashirqamar015-bit/mlops-cd-demo:sha-$SHORT_SHA .

      - name: Push image
        run: |
          docker push ghcr.io/mubashirqamar015-bit/mlops-cd-demo:sha-$SHORT_SHA

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/mubashirqamar015-bit/mlops-cd-demo:sha-$SHORT_SHA"

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/staging_key \
            "${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }}" \
            "set -e;
             docker pull $IMAGE;
             docker rm -f mlops-api 2>/dev/null || true;
             docker run -d \
               --restart unless-stopped \
               --name mlops-api \
               -p 5000:5000 \
               $IMAGE"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Smoke test staging
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/staging_key \
            "${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }}" \
            'for i in {1..10}; do
               if curl -fsS http://localhost:5000/health | grep -q "\"status\":\"healthy\""; then
                 echo "Staging health check passed"
                 exit 0
               fi
               echo "Health check failed, retrying..."
               sleep 3
             done
             echo "Staging health check failed after 10 attempts"
             exit 1'

      - name: Verify staging commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/staging_key \
            "${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }}" \
            "curl -fsS http://localhost:5000/health | grep -q '\"git_commit\":\"$SHORT_SHA\"'"

  status-final:
    if: always()
    needs:
      - status-pending
      - tests
      - build
      - deploy
      - smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Update staging status
        uses: actions/github-script@v7
        with:
          script: |
            const success =
              '${{ needs.tests.result }}' === 'success' &&
              '${{ needs.build.result }}' === 'success' &&
              '${{ needs.deploy.result }}' === 'success' &&
              '${{ needs.smoke-test.result }}' === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "staging/smoke-test",
              description: success
                ? "Staging deployment and smoke test passed"
                : "Staging deployment or smoke test failed"
            });
